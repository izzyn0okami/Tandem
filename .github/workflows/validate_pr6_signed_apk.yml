name: Validate PR #6 APK signature

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tandem-pr6-signed-validation
  cancel-in-progress: false

jobs:
  validate-signed-apk:
    if: github.repository == 'izzyn0okami/Tandem'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the current PR #6 head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="$(gh pr view 6 --repo "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid)"
          STATE="$(jq -r '.state' <<< "$PR")"
          BRANCH="$(jq -r '.headRefName' <<< "$PR")"
          SHA="$(jq -r '.headRefOid' <<< "$PR")"
          if [ "$STATE" != "OPEN" ] || [ "$BRANCH" != "fix/rom-archive-selection" ] || [ -z "$SHA" ]; then
            echo "::error::A PR #6 não está aberta na branch esperada."
            exit 1
          fi
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Validando PR #6 no commit $SHA"

      - name: Checkout PR #6
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==

      - name: Configure the same Tandem signing key used by tandem-latest
        env:
          TANDEM_KEYSTORE: ${{ secrets.TANDEM_KEYSTORE }}
          TANDEM_KEYSTORE_PASSWORD: ${{ secrets.TANDEM_KEYSTORE_PASSWORD }}
          TANDEM_KEY_ALIAS: ${{ secrets.TANDEM_KEY_ALIAS }}
          TANDEM_KEY_PASSWORD: ${{ secrets.TANDEM_KEY_PASSWORD }}
        run: |
          for name in TANDEM_KEYSTORE TANDEM_KEYSTORE_PASSWORD TANDEM_KEY_ALIAS TANDEM_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado; validação cancelada."
              exit 1
            fi
          done
          printf '%s\n' "storePassword=$TANDEM_KEYSTORE_PASSWORD" "keyAlias=$TANDEM_KEY_ALIAS" "keyPassword=$TANDEM_KEY_PASSWORD" "storeFile=$GITHUB_WORKSPACE/key.jks" > keystore.properties
          printf '%s' "$TANDEM_KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          chmod 600 keystore.properties "$GITHUB_WORKSPACE/key.jks"

      - name: Build APK with publication signing
        run: ./gradlew assembleLawnWithQuickstepGithubDebug

      - name: Locate the expected APK
        id: apk
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find build/outputs/apk -type f -name 'Lawnchair.*.github.debug.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um APK do variant lawnWithQuickstepGithubDebug; encontrados: ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          echo "path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          echo "APK selecionado: ${APKS[0]}"

      - name: Compare certificate with current tandem-latest APK
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/izzyn0okami/Tandem/releases/download/tandem-latest/Tandem.apk" \
            --output "$RUNNER_TEMP/Tandem-latest.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não foi encontrado no Android SDK."
            exit 1
          fi
          certificate_sha256() {
            local apk="$1"
            local verify_output
            if ! verify_output="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"; then
              echo "::error::apksigner não conseguiu validar: $apk"
              printf '%s\\n' "$verify_output"
              return 1
            fi
            local digest
            digest="$(printf '%s\\n' "$verify_output" | awk -F': ' 'tolower($1) ~ /certificate sha-256 digest/ { print $NF; exit }' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Não foi possível interpretar o SHA-256 do certificado em: $apk"
              printf '%s\\n' "$verify_output"
              return 1
            fi
            printf '%s' "$digest"
          }
          PR_CERT="$(certificate_sha256 "$APK_PATH")"
          LATEST_CERT="$(certificate_sha256 "$RUNNER_TEMP/Tandem-latest.apk")"
          if [ -z "$PR_CERT" ] || [ -z "$LATEST_CERT" ]; then
            echo "::error::A comparação foi interrompida porque um dos certificados não pôde ser lido."
            exit 1
          fi
          echo "Certificado PR #6: $PR_CERT"
          echo "Certificado tandem-latest: $LATEST_CERT"
          if [ "$PR_CERT" != "$LATEST_CERT" ]; then
            echo "::error::O APK da PR #6 não usa o mesmo certificado de tandem-latest."
            exit 1
          fi
          echo "Assinatura compatível: os certificados SHA-256 são idênticos."

      - name: Upload signed validation APK (never publish)
        if: always() && steps.apk.outputs.path != ''
        uses: actions/upload-artifact@v7
        with:
          name: Tandem-PR6-signed-validation
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
