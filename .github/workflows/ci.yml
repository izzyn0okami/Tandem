name: CI

on:
  push:
    branches:
      - '*-dev'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
  workflow_call:

env:
  PUBLISH_NIGHTLY: true

jobs:
  build-debug-apk:
    strategy:
      matrix:
        build-variant: [ assembleLawnWithQuickstepGithubDebug ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Write sign info
        if: github.repository_owner == 'LawnchairLauncher'
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi
      # Tandem: builds publicados exigem a chave privada do projeto.
      - name: Write sign info (Tandem)
        if: github.repository_owner != 'LawnchairLauncher' && github.event_name == 'push'
        env:
          TANDEM_KEYSTORE: ${{ secrets.TANDEM_KEYSTORE }}
          TANDEM_KEYSTORE_PASSWORD: ${{ secrets.TANDEM_KEYSTORE_PASSWORD }}
          TANDEM_KEY_ALIAS: ${{ secrets.TANDEM_KEY_ALIAS }}
          TANDEM_KEY_PASSWORD: ${{ secrets.TANDEM_KEY_PASSWORD }}
        run: |
          for name in TANDEM_KEYSTORE TANDEM_KEYSTORE_PASSWORD TANDEM_KEY_ALIAS TANDEM_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado; build de publicação cancelado."
              exit 1
            fi
          done
          printf '%s\n' "storePassword=$TANDEM_KEYSTORE_PASSWORD" "keyAlias=$TANDEM_KEY_ALIAS" "keyPassword=$TANDEM_KEY_PASSWORD" "storeFile=$GITHUB_WORKSPACE/key.jks" > keystore.properties
          printf '%s' "$TANDEM_KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          chmod 600 keystore.properties "$GITHUB_WORKSPACE/key.jks"
      - name: Run unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest
      - name: Build APK
        run: ./gradlew ${{ matrix.build-variant }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build-variant }}
          path: build/outputs/apk/**/*.apk

  check-style:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply Spotless automatically
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./gradlew spotlessApply
      - name: Commit formatting and rerun CI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply Spotless formatting"
            gh auth setup-git
            git push origin "HEAD:$PR_HEAD_REF"
          else
            echo "Spotless não encontrou alterações de formatação."
          fi
          gh workflow run ci.yml --ref "$PR_HEAD_REF"
      - name: Verify formatting
        run: ./gradlew spotlessCheck

  send-notifications:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'LawnchairLauncher'
    needs: build-debug-apk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install gitpython requests
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: assembleLawnWith*
          merge-multiple: true
          path: artifacts/debug-apk
      - name: Send notifications
        run: python ci.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          TELEGRAM_CI_CHANNEL_ID: ${{ secrets.TELEGRAM_CI_CHANNEL_ID }}
          TELEGRAM_TEAM_GROUP_ID: ${{ secrets.NOTIFY_CHANNEL_ID }}
          ARTIFACT_DIRECTORY: artifacts/debug-apk
          GITHUB_REF: ${{ github.ref }}
          ACTION: internal_notifications

  crowdin-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'lawnchair-bot' && github.event.pull_request.title == 'New Crowdin translations by Github Action'
    needs: build-debug-apk
    steps:
      - env:
          GH_TOKEN: ${{ secrets.LAWNCHAIR_BOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment $PR_URL --body "No issues found, auto-merging the Crowdin pull request."
          gh pr merge $PR_URL --auto --squash --delete-branch

  # Status check that is required in branch protection rules.
  final-status:
    needs:
      - build-debug-apk
      - check-style
    runs-on: ubuntu-slim
    if: always()
    outputs:
      publish_nightly: ${{ steps.publishing-status.outputs.publish_nightly }}
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs completed successfully."
      - id: publishing-status
        run: echo "publish_nightly=${{ env.PUBLISH_NIGHTLY }}" >> "$GITHUB_OUTPUT"

  nightly-release:
    runs-on: ubuntu-latest
    needs: final-status
    if: needs.final-status.outputs.publish_nightly == 'true' && github.repository_owner == 'LawnchairLauncher' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && endsWith(github.ref, '-dev')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assembleLawnWithQuickstepNightlyRelease
      # Note the # and () symbols are not supported in GitHub Release filenames, even manually
      - name: Export APK_NAME for later use
        run: echo "APK_NAME=Lawnchair.Debug.${{ github.ref_name }}.Nightly-CI_${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7).apk" >> $GITHUB_ENV
      - name: Rename .apk file
        run: mv "./lawnWithQuickstepNightly/release/"*.apk "./$APK_NAME"
      - name: Delete release if exist then create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "nightly" && gh release delete "nightly" -y --cleanup-tag
          gh release create "nightly" "./$APK_NAME" -p -t "Lawnchair Nightly" --generate-notes

# Tandem: publicação restrita à branch principal de desenvolvimento.
  # Tandem: mantém o APK mais recente numa página fixa de downloads do fork (cria a release uma vez e depois só troca o arquivo).
  tandem-release:
    runs-on: ubuntu-latest
    needs: final-status
    if: github.repository_owner != 'LawnchairLauncher' && github.event_name == 'push' && github.ref == 'refs/heads/game-mode-m2-dev' && needs.final-status.result == 'success'
    concurrency:
      group: tandem-latest-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assembleLawnWithQuickstepGithubDebug
          path: apk
      - name: Prepare APK
        run: |
          mkdir -p out
          cp "$(find apk -name '*.apk' | head -n 1)" out/Tandem.apk
          ls -l out
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Tandem (build ${{ github.run_number }})"
          NOTES="APK mais recente do Tandem. Baixe Tandem.apk e instale por cima da versão atual para atualizar. Commit ${{ github.sha }}."
          if gh release view tandem-latest > /dev/null 2>&1; then
            gh release upload tandem-latest out/Tandem.apk --clobber
            gh release edit tandem-latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create tandem-latest out/Tandem.apk --prerelease --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES"
          fi

          # Keep the permanent download tag aligned with the exact APK source commit.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/tandem-latest" -f sha="${GITHUB_SHA}" -F force=true
